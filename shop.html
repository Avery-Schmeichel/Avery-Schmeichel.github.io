<head>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #f5f2ed;
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      color: #2a2420;
      padding: 40px 20px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .back {
      align-self: flex-start;
      font-size: 13px;
      letter-spacing: 0.04em;
      color: #9a8f86;
      text-decoration: none;
      border-bottom: 1px solid #ccc7c0;
    }
    .back:hover { color: #5a504a; border-bottom-color: #9a8f86; }
    .back:focus-visible, .link:focus-visible {
      outline: 2px solid #2a2420;
      outline-offset: 3px;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: 520px;
      padding-bottom: 60px;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(32px, 6vw, 48px);
      letter-spacing: 0.08em;
      margin-bottom: 20px;
    }

    .soon {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(28px, 5vw, 40px);
      color: #5a504a;
      margin-bottom: 18px;
    }

    p {
      font-size: 16px;
      line-height: 1.75;
      color: #6b625a;
    }

    .link {
      color: #2a2420;
      text-decoration: none;
      border-bottom: 1px solid #9a8f86;
    }
    .link:hover { border-bottom-color: #2a2420; }

    /* Shared site menu */
    .sitenav {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid #ddd6cc;
    }
    .sitenav .wordmark {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
      font-size: 21px;
      letter-spacing: 0.08em;
      text-decoration: none;
      color: #2a2420;
    }
    .sitenav nav { display: flex; flex-wrap: wrap; gap: 8px 22px; }
    .sitenav nav a {
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
      color: #7a7068;
      border-bottom: 1px solid transparent;
      padding-bottom: 2px;
      transition: color 0.2s ease, border-color 0.2s ease;
    }
    .sitenav nav a:hover,
    .sitenav nav a[aria-current="page"] { color: #2a2420; border-bottom-color: #2a2420; }
    .sitenav a:focus-visible { outline: 2px solid #2a2420; outline-offset: 3px; }
  </style>
</head>
<body>
  <header class="sitenav">
    <a class="wordmark" href="index.html">Art by Avery</a>
    <nav aria-label="Main">
      <a href="gallery.html">Gallery</a>

      <a href="https://avery-schmeichel.github.io/shop.html" aria-current="page">Shop</a>
      <a href="commissions.html">Commissions</a>
      <a href="resources.html">Education</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main>
    <h1>Shop</h1>
    <p class="soon">Coming soon</p>
  </main>
</body>
</html>
