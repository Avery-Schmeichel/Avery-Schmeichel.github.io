<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop | Art by Avery</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #f5f2ed;
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      color: #2a2420;
      padding: 40px 20px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .back {
      align-self: flex-start;
      font-size: 13px;
      letter-spacing: 0.04em;
      color: #9a8f86;
      text-decoration: none;
      border-bottom: 1px solid #ccc7c0;
    }
    .back:hover { color: #5a504a; border-bottom-color: #9a8f86; }
    .back:focus-visible, .link:focus-visible {
      outline: 2px solid #2a2420;
      outline-offset: 3px;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: 520px;
      padding-bottom: 60px;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(32px, 6vw, 48px);
      letter-spacing: 0.08em;
      margin-bottom: 20px;
    }

    .soon {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(28px, 5vw, 40px);
      color: #5a504a;
      margin-bottom: 18px;
    }

    p {
      font-size: 16px;
      line-height: 1.75;
      color: #6b625a;
    }

    .link {
      color: #2a2420;
      text-decoration: none;
      border-bottom: 1px solid #9a8f86;
    }
    .link:hover { border-bottom-color: #2a2420; }
  </style>
</head>
<body>
  <a class="back" href="index.html">Back to home</a>

  <main>
    <h1>Shop</h1>
    <p class="soon">Coming soon</p>
  </main>
</body>
</html>
