<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art by Avery</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #f5f2ed;
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 52px;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(32px, 6vw, 52px);
      letter-spacing: 0.08em;
      color: #2a2420;
    }

    h1 em {
      font-style: italic;
      font-weight: 300;
    }

    .subtitle {
      font-size: 12px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #9a8f86;
      margin-top: 8px;
    }

    nav {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 620px;
    }

    /* Text-only cards: a solid color tile with the label inside */
    .nav-card {
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      text-decoration: none;
      aspect-ratio: 3/2;
      padding: 20px 18px 16px;
      border-radius: 3px;
      background: #3a322c;
      transition: background 0.3s ease;
    }

    .nav-card:hover {
      background: #2a2420;
    }

    .nav-card:focus-visible {
      outline: 2px solid #2a2420;
      outline-offset: 3px;
    }

    .nav-card span {
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      font-size: 19px;
      line-height: 1.3;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #f0ece6;
    }

    .nav-card svg {
      flex-shrink: 0;
      opacity: 0;
      transform: translate(-4px, 4px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      color: #f0ece6;
    }

    .nav-card:hover svg,
    .nav-card:focus-visible svg {
      opacity: 1;
      transform: translate(0, 0);
    }

    footer {
      margin-top: 48px;
      text-align: center;
    }

    footer p {
      font-size: 11px;
      color: #b0a89e;
      letter-spacing: 0.04em;
      line-height: 1.8;
    }

    footer a {
      color: #9a8f86;
      text-decoration: none;
      border-bottom: 1px solid #ccc7c0;
    }

    footer a:hover {
      color: #5a504a;
      border-bottom-color: #9a8f86;
    }

    @media (max-width: 480px) {
      nav {
        grid-template-columns: 1fr;
      }
      .nav-card {
        aspect-ratio: 5/2;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Artwork by <em>Avery</em></h1>
    <p class="subtitle">Artist &middot; Educator &middot;</p>
  </header>

  <nav>
    <a class="nav-card" href="gallery.html">
      <span>Gallery</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>

    <a class="nav-card" href="blog.html">
      <span>Blog</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>

    <a class="nav-card" href="https://avery-schmeichel.github.io/index4.html">
      <span>Shop</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>

    <a class="nav-card" href="commissions.html">
      <span>Commission Inquiry</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>

    <a class="nav-card" href="resources.html">
      <span>Art Education Resources</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>

    <a class="nav-card" href="about.html">
      <span>Meet the Artist</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>
  </nav>

  <footer>
    <p>
      Note: This list may be incomplete. &nbsp;
      <a href="https://github.com/Avery-Schmeichel/Avery-Schmeichel.github.io/search?q=.%28html%7Cmd%7Cjs%7Ccss%7Cpy%7Cts%29&type=code">View all files on GitHub</a>
    </p>
  </footer>

</body>
</html>
