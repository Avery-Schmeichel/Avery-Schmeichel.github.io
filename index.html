  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      color: #2a2420;
      background-color: #f5f2ed;
      /* soft watercolor washes behind everything */
      background-image:
        radial-gradient(ellipse 45% 40% at 12% 18%, rgba(196, 128, 98, 0.13), transparent 70%),
        radial-gradient(ellipse 40% 45% at 92% 80%, rgba(112, 138, 150, 0.14), transparent 70%),
        radial-gradient(ellipse 30% 30% at 70% 8%, rgba(214, 178, 96, 0.12), transparent 70%);
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
    }

    a { color: inherit; }
    a:focus-visible { outline: 2px solid #2a2420; outline-offset: 4px; }

    main {
      flex: 1;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 72px 28px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #9a8f86;
      margin-bottom: 20px;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(54px, 9vw, 96px);
      line-height: 0.95;
    }
    h1 em { display: block; font-style: italic; }

    /* a small hand-drawn-feeling brush stroke */
    .stroke {
      display: block;
      width: 150px;
      height: 10px;
      margin: 26px auto 34px;
      color: #b5694c;
    }

    nav ul { list-style: none; max-width: 540px; margin: 0 auto; text-align: left; }
    nav li { border-bottom: 1px solid #ddd6cc; }
    nav li:first-child { border-top: 1px solid #ddd6cc; }
    nav a {
      display: flex;
      padding: 18px 4px;
      text-decoration: none;
      font-size: clamp(17px, 3.2vw, 24px);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #4a413a;
      transition: padding-left 0.25s ease, color 0.25s ease;
    }
    nav a:hover { padding-left: 14px; color: #2a2420; }



    /* hand-drawn squiggles scattered in the margins */
    .doodles { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
    .doodles svg { position: absolute; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0.8; }
    .d1 { color: #b5694c; left: 7%;  top: 13%;    width: 150px; transform: rotate(-8deg); }
    .d2 { color: #6f8a96; right: 9%; top: 16%;    width: 110px; transform: rotate(6deg); }
    .d3 { color: #c9a24a; left: 9%;  bottom: 24%; width: 120px; transform: rotate(-4deg); }
    .d4 { color: #6f8a96; right: 7%; bottom: 17%; width: 190px; transform: rotate(-5deg); }
    .d5 { color: #b5694c; right: 18%; bottom: 36%; width: 70px; transform: rotate(12deg); }
    .d6 { color: #c9a24a; left: 20%; top: 38%;    width: 60px; transform: rotate(-14deg); }
    .d7  { color: #8a9a6b; left: 3%;   top: 55%;    width: 210px; transform: rotate(6deg); }
    .d8  { color: #c98a94; right: 4%;  top: 42%;    width: 100px; transform: rotate(-6deg); }
    .d9  { color: #c9a24a; right: 22%; top: 9%;     width: 44px;  transform: rotate(10deg); }
    .d10 { color: #6f8a96; left: 14%;  bottom: 8%;  width: 80px;  transform: rotate(-8deg); }
    .d11 { color: #b5694c; right: 14%; bottom: 7%;  width: 110px; transform: rotate(4deg); }
    .d12 { color: #c98a94; left: 26%;  top: 7%;     width: 50px;  transform: rotate(-10deg); }
    .d13 { color: #b5694c; left: 5%;   top: 33%;    width: 110px; transform: rotate(-12deg); }

    main { position: relative; z-index: 1; }

    /* small squiggle under the menu */
    .stroke.small { width: 90px; margin: 34px auto 0; color: #c9a24a; }


    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .intro > * { animation: rise 0.9s ease both; }
    .intro > :nth-child(2) { animation-delay: 0.08s; }
    .intro > :nth-child(3) { animation-delay: 0.16s; }
    .intro > :nth-child(4) { animation-delay: 0.24s; }



    /* Instagram icon */
    .social {
      display: inline-flex;
      margin-top: 40px;
      color: #7a7068;
      transition: color 0.2s ease, transform 0.2s ease;
    }
    .social:hover { color: #b5694c; transform: translateY(-2px); }
    .social:focus-visible { outline: 2px solid #2a2420; outline-offset: 4px; }

    /* one small piece that changes */
    .stamp { width: 128px; margin: 44px auto 0; }
    .stamp a {
      display: block;
      padding: 6px;
      background: transparent;
      border: 1.5px solid #2a2420;
      box-shadow: 0 16px 30px -18px rgba(42, 36, 32, 0.35);
      transform: rotate(-2deg);
      transition: transform 0.4s ease;
    }
    .stamp a:hover { transform: rotate(0deg); }
    .stamp .slot { position: relative; aspect-ratio: 4 / 5; overflow: hidden; background: #e2dcd3; }
    .stamp img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1.4s ease;
    }
    .stamp img.on { opacity: 1; }
    .stamp-cap {
      margin-top: 12px;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #9a8f86;
      min-height: 1.4em;
    }

    @media (max-width: 1000px) {
      .d7, .d8, .d4, .d13 { display: none; }
    }
    @media (max-width: 760px) {
      .d3, .d4, .d6, .d7, .d8, .d10, .d11, .d13 { display: none; }
      .d9 { right: 16%; }
      .d12 { left: 20%; top: 5%; }
      .d1 { width: 90px; left: 4%; top: 5%; }
      .d2 { width: 70px; right: 5%; top: 6%; }
      .d5 { right: 6%; bottom: 8%; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="doodles" aria-hidden="true">
    <svg class="d1" viewBox="0 0 150 24"><path d="M3 14 C 20 2, 34 22, 52 12 S 82 2, 100 13 S 130 22, 147 8"/></svg>
    <svg class="d2" viewBox="0 0 110 60"><path d="M6 36 C 22 4, 52 6, 44 30 C 38 50, 10 46, 22 26 C 34 8, 70 12, 102 34"/></svg>

    <svg class="d6" viewBox="0 0 60 40"><path d="M4 30 C 14 4, 24 36, 34 14 S 50 6, 56 22"/></svg>

    <svg class="d11" viewBox="0 0 100 40"><path d="M4 26 C 12 6, 26 6, 22 22 C 20 34, 36 34, 38 20 C 40 6, 56 6, 52 22 C 50 34, 66 34, 68 20 C 70 8, 84 10, 96 24"/></svg>
    <svg class="d13" viewBox="0 0 100 100"><path d="M50 50 C 50 44, 57 44, 57 50 C 57 59, 43 59, 43 49 C 43 38, 62 36, 64 50 C 66 66, 40 70, 34 52 C 28 32, 58 22, 72 42 C 84 60, 62 82, 38 76"/></svg>
    <svg class="d12" viewBox="0 0 50 24"><path d="M3 18 C 8 2, 18 2, 22 14 C 26 24, 38 24, 47 6"/></svg>
  </div>


  <main>
    <div class="intro">
      <p class="eyebrow">Artist &middot; Educator</p>
      <h1>Art by <em>Avery</em></h1>
      <svg class="stroke" viewBox="0 0 150 10" fill="none" aria-hidden="true"><path d="M2 6 C 28 1, 52 9, 80 5 S 128 2, 148 5" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>

      <nav aria-label="Main">
        <ul>
          <li><a href="gallery.html">Gallery</a></li>
          <li><a href="blog.html">Blog</a></li>
          <li><a href="https://avery-schmeichel.github.io/shop.html">Shop</a></li>
          <li><a href="commissions.html">Commission Inquiry</a></li>
          <li><a href="resources.html">Art Education Resources</a></li>
          <li><a href="about.html">Meet the Artist</a></li>
        </ul>
      </nav>
      <svg class="stroke small" viewBox="0 0 150 10" fill="none" aria-hidden="true"><path d="M2 6 C 26 1, 50 9, 76 5 S 124 2, 148 6" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>

      <figure class="stamp">
        <a href="gallery.html" aria-label="View the gallery">
          <div class="slot">
            <img class="on" src="gallery/apple_flowers.jpeg" alt="Apple and Flowers, oil painting">
            <img src="" alt="">
          </div>
        </a>
        <figcaption class="stamp-cap" aria-live="off">Apple &amp; Flowers, Oil</figcaption>
      </figure>

      <a class="social" href="https://www.instagram.com/artwork_by_aves/" target="_blank" rel="noopener" aria-label="Instagram (opens in a new tab)">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="0.6" fill="currentColor"/></svg>
      </a>
    </div>

  </main>


  <script>
    (function () {
      var pieces = [
        { src: "gallery/apple_flowers.jpeg", alt: "Apple and Flowers, oil painting", cap: "Apple & Flowers, Oil" },
        { src: "gallery/Kilauea.jpeg",       alt: "Kilauea, collage",               cap: "Kilauea, Collage" },
        { src: "gallery/rainbowfalls.jpeg",  alt: "Rainbow Falls, watercolor",      cap: "Rainbow Falls, Watercolor" },
        { src: "gallery/CatinRome.jpeg",     alt: "Cat in Rome, collage",           cap: "Cat in Rome, Collage" },
        { src: "gallery/bookandapples.jpeg", alt: "Flowers and apple study two, oil painting", cap: "Flowers & Apple Study, Oil" },
        { src: "gallery/Onomea.jpeg",        alt: "Onomea, watercolor",             cap: "Onomea, Watercolor" },
        { src: "gallery/MN.jpeg",            alt: "MN and ME, acrylic",             cap: "MN & ME, Acrylic" },
        { src: "gallery/rooster.jpeg",       alt: "Rooster, collage",               cap: "Rooster, Collage" }
      ];

      var box = document.querySelector('.stamp');
      if (!box) return;
      var imgs = box.querySelectorAll('img');
      var cap = box.querySelector('.stamp-cap');
      var current = 0, front = 0;

      function next() {
        current = (current + 1) % pieces.length;
        var p = pieces[current];
        var back = 1 - front;
        var incoming = imgs[back], outgoing = imgs[front];
        incoming.onload = function () {
          incoming.classList.add('on');
          outgoing.classList.remove('on');
          cap.textContent = p.cap;
          front = back;
          incoming.onload = null;
        };
        incoming.onerror = function () { incoming.onerror = null; };   // skip a missing file quietly
        incoming.alt = p.alt;
        incoming.src = p.src;
      }

      // people who prefer less motion just see the first piece
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!reduce) setInterval(next, 5000);
    })();
  </script>
</body>
